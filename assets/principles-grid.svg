<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360"><rect width="1280" height="360" rx="10" fill="#000"/><rect x="24" y="24" width="1232" height="312" rx="10" fill="none" stroke="#333"/><text x="48" y="58" fill="#666" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">PRINCÍPIOS</text><g font-family="Inter,Arial,sans-serif"><rect x="48" y="84" width="270" height="104" rx="12" fill="#111" stroke="#333"/><text x="66" y="118" fill="#2A2A2A" font-size="48" font-weight="900">01</text><text x="66" y="146" fill="#fff" font-size="17" font-weight="800">Entender antes de construir.</text><text x="66" y="169" fill="#999" font-size="13">Operação primeiro, arquitetura depois.</text><rect x="338" y="84" width="270" height="104" rx="12" fill="#111" stroke="#333"/><text x="356" y="118" fill="#2A2A2A" font-size="48" font-weight="900">02</text><text x="356" y="146" fill="#fff" font-size="17" font-weight="800">Remover complexidade.</text><text x="356" y="169" fill="#999" font-size="13">Menos camadas, menos atrito.</text><rect x="628" y="84" width="270" height="104" rx="12" fill="#111" stroke="#333"/><text x="646" y="118" fill="#2A2A2A" font-size="48" font-weight="900">03</text><text x="646" y="146" fill="#fff" font-size="17" font-weight="800">Automatizar repetição.</text><text x="646" y="169" fill="#999" font-size="13">Tempo humano fica onde gera valor.</text><rect x="918" y="84" width="314" height="104" rx="12" fill="#111" stroke="#333"/><text x="936" y="118" fill="#2A2A2A" font-size="48" font-weight="900">04</text><text x="936" y="146" fill="#fff" font-size="17" font-weight="800">Observar o produto.</text><text x="936" y="169" fill="#999" font-size="13">Logs, métricas e comportamento próximos.</text><rect x="48" y="208" width="354" height="104" rx="12" fill="#111" stroke="#333"/><text x="66" y="242" fill="#2A2A2A" font-size="48" font-weight="900">05</text><text x="66" y="270" fill="#fff" font-size="17" font-weight="800">Projetar para manutenção.</text><text x="66" y="293" fill="#999" font-size="13">Entrega importa; continuidade também.</text><rect x="422" y="208" width="354" height="104" rx="12" fill="#111" stroke="#333"/><text x="440" y="242" fill="#2A2A2A" font-size="48" font-weight="900">06</text><text x="440" y="270" fill="#fff" font-size="17" font-weight="800">Medir o que importa.</text><text x="440" y="293" fill="#999" font-size="13">Decisão técnica precisa de sinal real.</text><rect x="796" y="208" width="436" height="104" rx="12" fill="#111" stroke="#333"/><text x="814" y="242" fill="#2A2A2A" font-size="48" font-weight="900">07</text><text x="814" y="270" fill="#fff" font-size="17" font-weight="800">Evoluir depois que funciona.</text><text x="814" y="293" fill="#999" font-size="13">Primeiro valor. Depois refinamento, escala e eficiência.</text></g></svg>