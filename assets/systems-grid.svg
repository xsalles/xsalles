ersistência,</text><text x="479" y="243" fill="#999" font-family="Inter,Arial,sans-serif" font-size="14">regras de negócio e serviços.</text><path d="M711 112h58v58h-58zM725 126h30M725 142h30M725 158h20" fill="none" stroke="#555"/></g><g><rect x="870" y="84" width="362" height="190" rx="12" fill="#111" stroke="#333"/><text x="890" y="119" fill="#2A2A2A" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="900">03</text><rect x="890" y="136" width="72" height="22" rx="3" fill="#fff"/><text x="926" y="151" text-anchor="middle" fill="#000" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">PRODUTO</text><text x="890" y="191" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Transformar dado em decisão.</text><text x="890" y="220" fill="#999" font-family="Inter,Arial,sans-serif" font-size="14">Dashboards, sistemas administrativos e</text><text x="890" y="243" fill="#999" font-family="Inter,Arial,sans-serif" font-size="14">interfaces web responsivas.</text><path d="M1122 160v-42M1142 160v-70M1162 160v-30M1182 160v-54" stroke="#555" stroke-width="8"/></g></svg>